<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monister</title>
<style>
  :root { --neon: #ff2d87; }
  * { box-sizing: border-box; }
  body {
    background: #000; color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 18px 40px; text-align: center;
  }
  .logo { width: 55%; max-width: 200px; margin-bottom: 8px; }
  .sub { color: #888; font-size: 13px; margin: 0 0 18px; }

  /* ---- Plato de DJ ---- */
  .deck { position: relative; width: 230px; height: 230px; margin: 4px auto 10px; }
  .deck-glow {
    position: absolute; inset: -6px; border-radius: 50%;
    box-shadow: 0 0 35px 6px var(--neon); opacity: 0; transition: opacity .4s;
  }
  .record {
    position: absolute; inset: 8px; border-radius: 50%; background: #050505;
    background-image: repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.06) 0 1px, transparent 1px 4px);
    box-shadow: inset 0 0 50px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    animation: spin 2.2s linear infinite; animation-play-state: paused;
  }
  .label {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--neon), #b30e63);
    box-shadow: 0 0 0 4px #000;
    display: flex; align-items: center; justify-content: center; position: relative;
    color: #fff; font-weight: 800; font-size: 11px; letter-spacing: 1px;
  }
  .label span { transform: translateY(-1px); }
  .label::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #000; }
  .tonearm {
    position: absolute; top: 6px; right: 2px; width: 110px; height: 7px;
    background: linear-gradient(90deg, #777, #fff); border-radius: 6px; z-index: 3;
    transform-origin: calc(100% - 7px) 50%; transform: rotate(-34deg);
    transition: transform .6s ease; box-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  .tonearm::before { content: ""; position: absolute; right: -7px; top: -6px; width: 20px; height: 20px; border-radius: 50%; background: #ccc; }
  .tonearm::after  { content: ""; position: absolute; left: -4px; top: -3px; width: 14px; height: 13px; border-radius: 3px; background: #eee; }
  .playing .record  { animation-play-state: running; }
  .playing .tonearm { transform: rotate(-13deg); }
  .playing .deck-glow { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Controles ---- */
  .controls { width: 100%; max-width: 360px; }
  button {
    font-size: 17px; padding: 15px; width: 100%; margin: 7px 0;
    border-radius: 12px; cursor: pointer; font-weight: 600;
    background: transparent; color: #fff; border: 2px solid #fff;
    transition: transform .05s ease, background .15s ease, color .15s ease;
  }
  button:active { transform: scale(.98); }
  #nueva { background: #fff; color: #000; border-color: #fff; }
  button:focus-visible { outline: 3px solid var(--neon); outline-offset: 2px; }

  #estado { margin-top: 16px; min-height: 22px; font-size: 15px; color: #ddd; white-space: pre-line; }
  #respuesta {
    margin-top: 16px; max-width: 360px; width: 100%;
    padding: 16px; border: 2px solid #fff; border-radius: 12px;
    font-weight: 700; font-size: 16px; display: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .record { animation: none; } .tonearm { transition: none; }
  }
</style>
</head>
<body>
  <img class="logo" src="monister-logo.png" alt="Monister">
  <p class="sub">Entrenamiento musical</p>

  <div class="deck" id="deck">
    <div class="deck-glow"></div>
    <div class="record"><div class="label"><span>MONISTER</span></div></div>
    <div class="tonearm"></div>
  </div>

  <div class="controls">
    <button id="nueva">▶ Nueva canción</button>
    <button id="repetir">🔁 Repetir</button>
    <button id="revelar">👁 Revelar</button>
  </div>

  <div id="estado">Pulsa "Nueva canción" para empezar.</div>
  <div id="respuesta"></div>

<script>
const deck = document.getElementById('deck');
const estado = document.getElementById('estado');
const respuesta = document.getElementById('respuesta');
let cancion = null;
let audio = null;

function buscarItunes(termino) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const t = setTimeout(() => { limpiar(); reject(new Error('tiempo agotado')); }, 8000);
    function limpiar() { clearTimeout(t); delete window[cb]; script.remove(); }
    window[cb] = (data) => { limpiar(); resolve(data.results || []); };
    script.onerror = () => { limpiar(); reject(new Error('red')); };
    script.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(termino) +
                 '&media=music&entity=song&limit=5&callback=' + cb;
    document.body.appendChild(script);
  });
}

function pararAudio() {
  if (audio) { audio.pause(); audio = null; }
  deck.classList.remove('playing');
}

function sonar() {
  pararAudio();
  audio = new Audio(cancion._preview);
  audio.play()
    .then(() => { deck.classList.add('playing'); estado.textContent = '🔊 Sonando 4 segundos… ¿qué canción es?'; })
    .catch(e => estado.textContent = 'No se pudo reproducir: ' + e.message);
  setTimeout(pararAudio, 4000);
}

async function nuevaCancion() {
  if (typeof SONGS === 'undefined' || !SONGS.length) {
    estado.textContent = 'No encuentro songs.js (o está vacío). Ponlo en la misma carpeta.';
    return;
  }
  pararAudio();
  respuesta.style.display = 'none';
  estado.textContent = 'Cargando…';
  cancion = SONGS[Math.floor(Math.random() * SONGS.length)];

  if (!cancion._preview) {
    try {
      const res = await buscarItunes(cancion.artist + ' ' + cancion.title);
      const hit = res.find(r => r.previewUrl);
      if (!hit) {
        estado.textContent = '😕 Sin preview en iTunes:\n' + cancion.artist + ' – ' + cancion.title;
        return;
      }
      cancion._preview = hit.previewUrl;
    } catch (e) {
      estado.textContent = 'Error de red (' + e.message + '). ¿Tienes conexión?';
      return;
    }
  }
  sonar();
}

function revelar() {
  if (!cancion || !cancion._preview) return;
  respuesta.style.display = 'block';
  respuesta.textContent = '✅ ' + cancion.artist + ' – ' + cancion.title + ' (' + cancion.year + ')';
}

document.getElementById('nueva').addEventListener('click', nuevaCancion);
document.getElementById('repetir').addEventListener('click', () => { if (cancion && cancion._preview) sonar(); });
document.getElementById('revelar').addEventListener('click', revelar);
</script>
<script src="songs.js"></script>
</body>
</html>
