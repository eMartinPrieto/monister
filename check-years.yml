name: Comprobar años (MusicBrainz)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check_years.py
      - uses: actions/upload-artifact@v4
        with:
          name: informe-anos
          path: informe_anos.md
